name: bus_explorer_rack

# The rack's description is a repository of its own: it stands for the
# library the generated units are analysed into.
repositories:
  - path: description.yaml
    loader: gatecap-description

root:
  name: top
  deps:
    # The rack, and what the testbench itself uses.
    - gatecap_generated.explorer_pkg
    - gatecap.bus_explorer
    - nsl_amba.apb
    - nsl_data.text
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    outputs:
      - type: simulation-log
        path: tb.log
