# The build generates the rack's VHDL from this description.
#
# One bus explorer behind the plain APB completer, mastering a narrow target
# bus on a clock of its own: 10 address bits, 16 data bits, four scan slots.
# Both crossings of the inner contract are instantiated.
name: explorer_pkg.explorer_rack

communication:
  mode: apb

instruments:
  gt0: !bus-explorer
    clock: drpclk
    address-width: 10
    data-width: 16
    slots: 4
    map: xilinx-gtye4-drp
    timeout: 64
