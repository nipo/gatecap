# Regenerate the VHDL sitting next to this file with:
#
#   cd host && python3.13 -m acrobe gatecap generate \
#     ../gateware/tests/bus_explorer_rack/description.yaml \
#     -o ../gateware/tests/bus_explorer_rack/generated/
#
# One bus explorer behind the plain APB completer, mastering a narrow target
# bus on a clock of its own: 10 address bits, 16 data bits, four scan slots.
# Both crossings of the inner contract are instantiated.
name: explorer_pkg.explorer_rack

communication:
  mode: apb

instruments:
  gt0: !bus-explorer
    clock: drpclk
    address-width: 10
    data-width: 16
    slots: 4
    map: xilinx-gtye4-drp
    timeout: 64
