name: descriptor

root:
  name: top
  deps:
    - gatecap.bus_explorer
    - gatecap.descriptor
    - nsl_data.bytestream
    - nsl_data.cbor
    - nsl_data.text
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    outputs:
      - type: simulation-log
        path: tb.log
