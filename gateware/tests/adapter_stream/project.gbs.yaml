name: adapter_stream

root:
  name: top
  deps:
    - gatecap.adapter_stream
    - gatecap.testing
    - nsl_amba.apb
    - nsl_amba.axi4_stream
    - nsl_amba.ram
    - nsl_data.bytestream
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    outputs:
      - type: simulation-log
        path: tb.log
