# The build generates the rack from this description; the emitted units are
# analysed into the gatecap_generated library.
#
# The eight counter bits advertised as one bus carrying an enumeration: values
# 0..2 come from the well-known demo.phase table, 3..5 are the description's own
# additions, and 6..255 stay undefined for the host to render as hex. Splice,
# extend and undefined are all exercised through a real descriptor.
name: enum_pkg.enum_capture

communication:
  mode: axi4_stream
  clock: la.control

instruments:
  la: !logic-analyzer
    storage:
      buffer_depth_l2: 8

    capture:
      max_windows: 1

    trigger:
      capabilities: value

    domains:
      control:
        clock: clock
        frequency: 100_000_000

        signals:
          count: !bus
            width: 8
            trigger: true
            enum:
              base: demo.phase
              3: custom0
              4: custom1
              5: STOP
