name: gatecap_usb2

# The rack's description is a repository of its own: it stands for the
# library the generated units are analysed into.
repositories:
  - path: description.yaml
    loader: gatecap-description

root:
  name: top
  deps:
    # The rack, and what the top level and the phy wrapper themselves use.
    - gatecap_generated.tang_console
    - nsl_amba.axi4_stream
    - nsl_bnoc.axi_adapter
    - nsl_bnoc.chunked_link
    - nsl_bnoc.framed
    - nsl_bnoc.pipe
    - nsl_clocking.pll
    - nsl_hwdep.clock
    - nsl_indication.activity
    - nsl_io.io
    - nsl_sipeed.pmod_dtx2
    - nsl_usb.func
    - nsl_usb.io
    - nsl_usb.usb
    - nsl_usb.utmi
  sources:
    - file_type: verilog
      files:
        - phy/usb2_0_softphy.v
    - file_type: vhdl
      files:
        - phy/softphy.pkg.vhd
        - phy/gw_usb2_phy.vhd
        - main.vhd
    - file_type: gowin-cst
      files:
        - constraint/usb2.cst
#        - constraint/spi_flash.cst
        - constraint/pll.cst
        - constraint/done_led.cst
        - constraint/ready_led.cst
        - constraint/buttons.cst
        - constraint/clk.cst
        - constraint/j6_pmod_double_lvcmos33.cst
        - constraint/j7_pmod_double_lvcmos33.cst
        - constraint/clk.cst
    - file_type: gowin-sdc
      files:
        - constraint/clk.sdc

output:
  - name: synthesis
    topcell: main
    target:
      part: GW5AT-LV60PG484AC1/I0#B
      use_as_gpio:
        - sspi
        - mspi
        - done
        - ready
        - cpu
    outputs:
      - type: bitstream
        path: usb2.fs
