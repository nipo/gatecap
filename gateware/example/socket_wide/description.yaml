# The build generates the rack from this description; the emitted units are
# analysed into the gatecap_generated library.
#
# A capture wider than one APB word: 48 traced bits, so the trace buffer
# stores 48-bit lines and the host reads two words per sample. The trigger stays
# inside the 32-bit cap by watching the low eight bits alone, which is a probe of
# its own -- the traced 40 above it take no part in matching.
name: wide_pkg.wide_capture

communication:
  mode: axi4_stream
  clock: la.control

instruments:
  la: !logic-analyzer
    storage:
      buffer_depth_l2: 6

    capture:
      max_windows: 1

    trigger:
      capabilities: value

    domains:
      control:
        clock: clock
        frequency: 100_000_000

        signals:
          count: !bus
            width: 8
            trigger: true
          high: !bus
            width: 40
