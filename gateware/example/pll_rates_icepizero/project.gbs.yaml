name: pll_rates_icepizero

# The rack's description is a repository of its own: it stands for the
# library the generated units are analysed into.
repositories:
  - path: description.yaml
    loader: gatecap-description

root:
  name: top
  deps:
    # The rack, and the PLL under test.
    - gatecap_generated.pll_rates_ipz
    - nsl_clocking.pll
  sources:
    - file_type: vhdl
      files:
        - main.vhd
    - file_type: ecp5-lpf
      files:
        - pins.lpf

output:
  - name: pnr
    topcell: main
    target:
      part: lfe5u-25f-6bg256c
    outputs:
      - type: bitstream
        path: pll_rates.bit
