# The build generates the rack from this description; the emitted units are
# analysed into the gatecap_generated library.
#
# Hardware counterpart of the pll_rates bench, for the Sipeed Tang Console
# 60k: one clock measurer watching every output of an NSL pll_multi instance
# against the 50 MHz board oscillator the PLL itself runs from. Reference and
# PLL input being the same crystal, a measured rate is the realized
# input-to-output ratio: the crystal's own error cancels, so the rates come
# back good to the hardware default once-per-second window's quantum of 1 Hz.
name: pll_rates_hw.pll_rates_core

communication:
  mode: axi4_stream

instruments:
  rates: !clock-measurer
    reference: ref
    frequency: 50_000_000
    clocks: [out0, out1, out2, out3]
    max_rate: 160_000_000
