name: gatecap_usb

# The rack's description is a repository of its own: it stands for the
# library the generated units are analysed into.
repositories:
  - path: description.yaml
    loader: gatecap-description

root:
  name: top
  deps:
    # The rack, and what the top level itself uses.
    - gatecap_generated.demo_package
    - nsl_clocking.pll
    - nsl_hwdep.clock
    - nsl_usb.io
  sources:
    - file_type: vhdl
      files:
        - main.vhd
    - file_type: gowin-cst
      files:
        - constraint/usb11.cst
        - constraint/done_led.cst
        - constraint/ready_led.cst
        - constraint/buttons.cst
        - constraint/clk.cst
    - file_type: gowin-sdc
      files:
        - constraint/clk.sdc

output:
  - name: synthesis
    topcell: main
    target:
      part: GW5AT-LV60PG484AC1/I0#B
      use_as_gpio:
        - sspi
        - mspi
        - done
        - ready
        - cpu
    outputs:
      - type: bitstream
        path: usb11.fs
