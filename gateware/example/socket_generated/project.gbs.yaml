name: socket_generated

root:
  name: top
  deps:
    - gatecap.adapter_stream
    - gatecap.axi4_stream_packer
    - gatecap.capture
    - gatecap.control
    - gatecap.descriptor
    - gatecap.trace
    - nsl_amba.address
    - nsl_amba.apb
    - nsl_amba.apb_routing
    - nsl_amba.axi4_stream
    - nsl_amba.rom
    - nsl_amba.stream_apb
    - nsl_amba.stream_to_udp
    - nsl_clocking.interdomain
    - nsl_data.bytestream
    - nsl_math.arith
    - nsl_memory.rom
    - nsl_synthesis.assertion
  sources:
    - file_type: vhdl
      files:
        - generated/link_capture_la.vhd
        - generated/link_pkg.pkg.vhd
        - generated/link_capture_backplane.vhd
        - generated/link_capture.vhd
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    outputs:
      - type: simulator
        path: tb
