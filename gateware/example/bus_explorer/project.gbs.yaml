name: bus_explorer

root:
  name: top
  deps:
    - gatecap.adapter_stream
    - gatecap.bus_explorer
    - gatecap.descriptor
    - nsl_amba.address
    - nsl_amba.apb
    - nsl_amba.apb_routing
    - nsl_amba.axi4_stream
    - nsl_amba.rom
    - nsl_amba.stream_to_udp
    - nsl_clocking.interdomain
    - nsl_data.bytestream
    - nsl_math.arith
    - nsl_memory.rom
    - nsl_simulation.driver
    - nsl_synthesis.assertion
  sources:
    - file_type: vhdl
      files:
        - generated/busx_core_dut.vhd
        - generated/busx_pkg.pkg.vhd
        - generated/busx_core_backplane.vhd
        - generated/busx_core.vhd
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    outputs:
      - type: simulator
        path: tb
