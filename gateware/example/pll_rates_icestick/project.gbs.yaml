name: pll_rates_icestick

# The rack's description is a repository of its own: it stands for the
# library the generated units are analysed into.
repositories:
  - path: description.yaml
    loader: gatecap-description

root:
  name: top
  deps:
    # The rack, and the PLL under test.
    - gatecap_generated.pll_rates_ist
    - nsl_clocking.pll
    - nsl_spi.spi
  sources:
    - file_type: vhdl
      files:
        - main.vhd
    - file_type: ice40-pcf
      files:
        - demo.pcf

output:
  - name: pnr
    topcell: main
    target:
      part: iCE40HX1K-TQ144
    backend_config:
      gbs.builtin.yosys:
        tool: "yosys"
        steps:
          - chformal -remove
          - flatten
          - tribuf -logic
          - deminout
    outputs:
      - type: bitstream
        path: pll_rates.bin
