# The build generates the rack from this description; the emitted units are
# analysed into the gatecap_generated library.
#
# Hardware counterpart of the pll_rates bench for the iCEstick: one clock
# measurer watching the single output of an NSL pll_multi instance against
# the 12 MHz board oscillator the PLL itself runs from, reached over the
# FT2232H port-B SPI. The requested rate is deliberately not reachable on the
# iCE40's power-of-two output divider, so the rate the host reads back is the
# solver's approximation. The window is 2**-10 s to fit the HX1K, so rates
# come out to the nearest 1024 Hz.
name: pll_rates_ist.pll_rates_core

communication:
  mode: spi
  max_rate: 1_000_000

instruments:
  rates: !clock-measurer
    reference: ref
    frequency: 12_000_000
    clocks: [out0]
    max_rate: 24_000_000
    update_hz_l2: 10
