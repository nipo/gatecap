name: socket_mixed

root:
  name: top
  deps:
    - gatecap.adapter_stream
    - gatecap.capture
    - gatecap.control
    - gatecap.control_status
    - gatecap.descriptor
    - gatecap.trace
    - nsl_amba.address
    - nsl_amba.apb
    - nsl_amba.apb_routing
    - nsl_amba.axi4_stream
    - nsl_amba.rom
    - nsl_amba.stream_apb
    - nsl_amba.stream_to_udp
    - nsl_clocking.interdomain
    - nsl_data.bytestream
    - nsl_math.arith
    - nsl_math.int_ext
    - nsl_memory.rom
    - nsl_synthesis.assertion
  sources:
    - file_type: vhdl
      files:
        - generated/mixed_rack_la.vhd
        - generated/mixed_rack_panel.vhd
        - generated/mixed_pkg.pkg.vhd
        - generated/mixed_rack_backplane.vhd
        - generated/mixed_rack.vhd
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    outputs:
      - type: simulator
        path: tb
