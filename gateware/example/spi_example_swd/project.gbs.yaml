name: spi_example_swd

root:
  name: top
  deps:
    - gatecap.adapter_swd
    - gatecap.bnoc_packer
    - gatecap.capture
    - gatecap.control
    - gatecap.descriptor
    - gatecap.trace
    - nsl_amba.address
    - nsl_amba.apb
    - nsl_amba.apb_routing
    - nsl_amba.axi4_mm
    - nsl_amba.axi4_stream
    - nsl_amba.axi_apb
    - nsl_amba.rom
    - nsl_amba.stream_to_udp
    - nsl_bnoc.axi_adapter
    - nsl_bnoc.framed
    - nsl_clocking.interdomain
    - nsl_coresight.ap
    - nsl_coresight.dapbus
    - nsl_coresight.dp
    - nsl_coresight.swd
    - nsl_coresight.transactor
    - nsl_data.bytestream
    - nsl_io.io
    - nsl_math.arith
    - nsl_memory.ram
    - nsl_memory.rom
    - nsl_simulation.driver
    - nsl_spi.slave
    - nsl_spi.spi
    - nsl_spi.transactor
    - nsl_synthesis.assertion
  sources:
    - file_type: vhdl
      files:
        - generated/spi_swd_capture_la.vhd
        - generated/spi_probe.pkg.vhd
        - generated/spi_swd_capture_backplane.vhd
        - generated/spi_swd_capture.vhd
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    outputs:
      - type: simulator
        path: tb
