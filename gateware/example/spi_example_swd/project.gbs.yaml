name: spi_example_swd

# The rack's description is a repository of its own: it stands for the
# library the generated units are analysed into.
repositories:
  - path: description.yaml
    loader: gatecap-description

root:
  name: top
  deps:
    # The rack, and what the testbench itself uses.
    - gatecap_generated.spi_probe
    - nsl_amba.axi4_stream
    - nsl_amba.stream_to_udp
    - nsl_bnoc.axi_adapter
    - nsl_bnoc.framed
    - nsl_coresight.swd
    - nsl_coresight.transactor
    - nsl_data.bytestream
    - nsl_io.io
    - nsl_memory.ram
    - nsl_simulation.driver
    - nsl_spi.slave
    - nsl_spi.spi
    - nsl_spi.transactor
  sources:
    - file_type: vhdl
      files:
        - tb.vhd

output:
  - name: simulation
    topcell: tb
    filter_vars:
      hwdep: simulation
    outputs:
      - type: simulator
        path: tb
