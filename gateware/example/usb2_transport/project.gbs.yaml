name: gatecap_usb2

root:
  name: top
  deps:
    - nsl_hwdep.clock
    - nsl_hwdep.reset
    - nsl_clocking.async
    - nsl_clocking.pll
    - nsl_clocking.distribution
    - nsl_indication.activity
    - nsl_usb.usb
    - nsl_usb.utmi
    - nsl_usb.fs_phy
    - nsl_usb.func
    - nsl_usb.io
    - nsl_bnoc.pipe
    - nsl_spi.transactor
    - nsl_bnoc.framed
    - nsl_bnoc.chunked_link
    - gatecap.adapter_stream
    - gatecap.bnoc_packer
    - gatecap.capture
    - gatecap.control
    - gatecap.descriptor
    - gatecap.trace
    - nsl_amba.address
    - nsl_amba.apb
    - nsl_amba.apb_routing
    - nsl_amba.axi4_stream
    - nsl_amba.rom
    - nsl_bnoc.axi_adapter
    - nsl_clocking.interdomain
    - nsl_data.bytestream
    - nsl_io.io
    - nsl_math.arith
    - nsl_memory.rom
    - nsl_synthesis.assertion
  sources:
    - file_type: verilog
      files:
        - phy/usb2_0_softphy.v
    - file_type: vhdl
      files:
        - phy/softphy.pkg.vhd
        - phy/gw_usb2_phy.vhd
        - generated/spi_usb2_capture_la.vhd
        - generated/spi_probe.pkg.vhd
        - generated/spi_usb2_capture_backplane.vhd
        - generated/spi_usb2_capture.vhd
        - main.vhd
    - file_type: gowin-cst
      files:
        - constraint/usb2.cst
        - constraint/spi_flash.cst
        - constraint/done_led.cst
        - constraint/ready_led.cst
        - constraint/buttons.cst
        - constraint/clk.cst
    - file_type: gowin-sdc
      files:
        - constraint/clk.sdc

output:
  - name: synthesis
    topcell: main
    target:
      part: GW5AT-LV60PG484AC1/I0#B
      use_as_gpio:
        - sspi
        - mspi
        - done
        - ready
        - cpu
    outputs:
      - type: bitstream
        path: usb2.fs
